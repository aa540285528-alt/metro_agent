<style>
        .no-scrollbar::-webkit-scrollbar { display: none; }

            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            cursor: pointer;
        }
        .history-action-trigger.is-active {
            opacity: 1 !important;
            color: #0033ff !important;
            background: rgba(0, 51, 255, 0.08);
            box-shadow: 0 0 0 2px #0033ff;
        }
        .history-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #c4c5da transparent;
        }
        .history-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .history-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-scrollbar::-webkit-scrollbar-thumb {
            background: #c4c5da;
            border-radius: 9999px;
        }
        .history-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #747689;
        }
        .chat-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #c4c5da transparent;
        }
        .chat-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scrollbar::-webkit-scrollbar-thumb {
            background: #c4c5da;
            border-radius: 9999px;
        }
        .chat-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #747689;
        }
        .thread-index-rail {
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 16px 40px rgba(20, 27, 43, 0.12);
            width: 24px;
            max-height: 360px;
            overflow: hidden;
            transition: width 0.22s ease, padding 0.22s ease, border-radius 0.22s ease;
        }
        .thread-index-rail:hover,
        .thread-index-rail:focus-within {
            width: 220px;
            padding-left: 14px;
            padding-right: 10px;
        }
        .thread-index-list {
            max-height: 320px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #c4c5da transparent;
        }
        .thread-index-list::-webkit-scrollbar {
            width: 4px;
        }
        .thread-index-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .thread-index-list::-webkit-scrollbar-thumb {
            background: #c4c5da;
            border-radius: 9999px;
        }
        .thread-index-item {
            width: 100%;
            min-height: 30px;
            display: grid;
            grid-template-columns: 18px 1fr 14px;
            gap: 8px;
            align-items: center;
            color: #747689;
            border-radius: 10px;
            padding: 4px 6px;
            transition: background 0.16s ease, color 0.16s ease;
        }
        .thread-index-item:hover {
            background: rgba(0, 51, 255, 0.06);
            color: #0033ff;
        }
        .thread-index-item.is-active {
            color: #0033ff;
            background: rgba(0, 51, 255, 0.1);
        }
        .thread-index-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.16s ease;
        }
        .thread-index-rail:hover .thread-index-label,
        .thread-index-rail:focus-within .thread-index-label {
            opacity: 1;
        }
        .thread-index-mark {
            width: 16px;
            height: 2px;
            border-radius: 9999px;
            background: currentColor;
            justify-self: center;
        }
        .thread-index-dot {

            height: 8px;

</div>
<script>
        // Keep the composer within the fixed chat layout while preserving long-input editing.
        const MAX_COMPOSER_HEIGHT = 160;
        const textarea = document.querySelector('textarea');
        if(textarea) {
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = `${Math.min(this.scrollHeight, MAX_COMPOSER_HEIGHT)}px`;
                this.style.overflowY = this.scrollHeight > MAX_COMPOSER_HEIGHT ? 'auto' : 'hidden';
            });
        }

        // Enter conversation state after sending a message
        const chatWorkspace = document.getElementById('chat-workspace');
        const welcomeState = document.getElementById('welcome-state');
        const chatThread = document.getElementById('chat-thread');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const promptSuggestions = document.getElementById('prompt-suggestions');
        const messageThreadRail = document.getElementById('message-thread-rail');
        const messageThreadList = document.getElementById('message-thread-list');
        const historyList = document.getElementById('history-list');
        const historyError = document.getElementById('history-error');
        const historyActionMenu = document.getElementById('history-action-menu');
        const renameDialog = document.getElementById('rename-dialog');
        const renameForm = document.getElementById('rename-form');
        const renameInput = document.getElementById('rename-input');
        const deleteConfirmDialog = document.getElementById('delete-confirm-dialog');
        const deleteCancelButton = document.querySelector('[data-delete-cancel]');
        const monitoringWorkspace = document.getElementById('monitoring-workspace');
        const monitoringKpis = document.getElementById('monitoring-kpis');
        const monitoringTraceList = document.getElementById('monitoring-trace-list');
        const monitoringTraceDetail = document.getElementById('monitoring-trace-detail');
        const monitoringTraceLayout = document.getElementById('monitoring-trace-layout');
        const monitoringOnlinePanel = document.getElementById('monitoring-online-panel');
        const monitoringEvaluationPanel = document.getElementById('monitoring-evaluation-panel');
        const authGate = document.getElementById('auth-gate');
        const authLoading = document.getElementById('auth-loading');
        const loginView = document.getElementById('login-view');
        const authServiceError = document.getElementById('auth-service-error');
        const authRetry = document.getElementById('auth-retry');
        const loginForm = document.getElementById('login-form');
        const loginUsername = document.getElementById('login-username');
        const loginPassword = document.getElementById('login-password');
        const loginSubmit = document.getElementById('login-submit');
        const loginError = document.getElementById('login-error');
        const appShell = document.getElementById('app-shell');
        const logoutButtons = document.querySelectorAll('[data-logout-trigger]');
        const logoutError = document.getElementById('logout-error');
        const logoutErrorMessage = document.getElementById('logout-error-message');
        const logoutErrorClose = document.getElementById('logout-error-close');
        let messageThreadCounter = 0;
        const STORAGE_KEYS = {
            threadId: 'metro-chat-thread-id'
        };
        let currentUser = null;
        let activeRequestController = null;
        let isSending = false;

        function createBrowserId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }

            return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        function getOrCreateStoredId(storageKey) {
            try {
                const storedId = localStorage.getItem(storageKey);
                if (storedId) return storedId;

                const newId = createBrowserId();
                localStorage.setItem(storageKey, newId);
                return newId;
            } catch (error) {
                return createBrowserId();
            }
        }

        let currentThreadId = null;
        let historyEntries = [];
        let activeHistoryConversation = null;
        let activeHistoryActionTrigger = null;
        let historyRequestGeneration = 0;
        let activeHistoryRequestController = null;
        let historyListRequestGeneration = 0;
        let activeHistoryListRequestController = null;
        let dialogReturnFocus = null;
        let monitoringRequestGeneration = 0;
        let activeMonitoringRequestController = null;
        let monitoringData = { summary: null, traces: [], evaluations: [] };
        let activeMonitoringTab = 'traces';
        let appStatusTimer = null;

        class UnauthorizedError extends Error {}

        function setAuthGateState(state) {
            authLoading?.classList.toggle('hidden', state !== 'loading');
            loginView?.classList.toggle('hidden', state !== 'login');
            authServiceError?.classList.toggle('hidden', state !== 'error');
        }

        function showLoginView(message = '') {
            authGate?.classList.remove('hidden');
            appShell?.classList.add('hidden');
            setAuthGateState('login');
            if (loginError) {
                loginError.textContent = message;
                loginError.classList.toggle('hidden', !message);
            }
            setTimeout(() => loginUsername?.focus(), 0);
        }

        function showAuthServiceError() {
            authGate?.classList.remove('hidden');
            appShell?.classList.add('hidden');
            setAuthGateState('error');
        }

        function isAdmin() {
            return currentUser?.role === 'admin';
        }

        function clearAppStatus() {
            clearTimeout(appStatusTimer);
            appStatusTimer = null;
            if (logoutErrorMessage) logoutErrorMessage.textContent = '';
            logoutError?.classList.add('hidden');
            logoutError?.classList.remove('flex');
        }

        function showAppStatus(message) {
            clearTimeout(appStatusTimer);
            if (logoutErrorMessage) logoutErrorMessage.textContent = message;
            logoutError?.classList.remove('hidden');
            logoutError?.classList.add('flex');
            appStatusTimer = setTimeout(clearAppStatus, 5000);
        }

        function clearStoredThreadState() {
            currentThreadId = null;
            try {
                localStorage.removeItem(STORAGE_KEYS.threadId);
            } catch (error) {
                // In-memory cleanup remains effective when browser storage is unavailable.
            }
        }

        function prepareAuthenticatedThread({ reuseStoredThread }) {
            if (!reuseStoredThread) clearStoredThreadState();
            currentThreadId = getOrCreateStoredId(STORAGE_KEYS.threadId);
        }

        function setMonitoringAccess() {
            const allowed = isAdmin();
            document.querySelectorAll('[data-monitoring-trigger]').forEach((button) => {
                button.classList.toggle('hidden', !allowed);
                button.disabled = !allowed;
            });
            if (!allowed) {
                clearMonitoringState();
                monitoringWorkspace?.classList.add('hidden');
                chatWorkspace?.classList.remove('hidden');
            }
        }

        function isCurrentMonitoringRequest(requestGeneration, controller) {
            return isAdmin()
                && requestGeneration === monitoringRequestGeneration
                && activeMonitoringRequestController === controller;
        }

        function clearMonitoringState() {
            monitoringRequestGeneration += 1;
            activeMonitoringRequestController?.abort();
            activeMonitoringRequestController = null;
            monitoringData = { summary: null, traces: [], evaluations: [] };
            monitoringKpis?.replaceChildren();
            monitoringTraceList?.replaceChildren();
            monitoringTraceDetail?.replaceChildren();
            monitoringOnlinePanel?.replaceChildren();
            monitoringEvaluationPanel?.replaceChildren();
        }

        function clearAuthenticatedState() {
            currentUser = null;
            activeRequestController?.abort();
            activeHistoryRequestController?.abort();
            activeHistoryListRequestController?.abort();
            historyRequestGeneration += 1;
            historyListRequestGeneration += 1;
            activeRequestController = null;
            activeHistoryRequestController = null;
            activeHistoryListRequestController = null;
            historyEntries = [];
            activeHistoryConversation = null;
            clearStoredThreadState();
            clearMonitoringState();
            clearAppStatus();
            historyList?.replaceChildren();
            chatMessages?.replaceChildren();
            messageThreadList?.replaceChildren();
            if (chatInput) chatInput.value = '';
            messageThreadCounter = 0;
            monitoringWorkspace?.classList.add('hidden');
            chatWorkspace?.classList.remove('hidden', 'justify-end');
            chatWorkspace?.classList.add('justify-center');
            welcomeState?.classList.remove('hidden');
            promptSuggestions?.classList.remove('hidden');
            chatThread?.classList.add('hidden');
            messageThreadRail?.classList.add('hidden');
            composerSection?.classList.remove('mt-4', 'mt-24');
            composerSection?.classList.add('mt-8');
            renameDialog?.classList.add('hidden');
            deleteConfirmDialog?.classList.add('hidden');
            setSending(false);
            setMonitoringAccess();
            showLoginView();
        }

        async function apiFetch(input, options = {}, { handleUnauthorized = true } = {}) {
            const response = await fetch(input, {
                ...options,
                credentials: 'same-origin'
            });
            if (response.status === 401 && handleUnauthorized) {
                clearAuthenticatedState();
                throw new UnauthorizedError('Authentication required');
            }
            return response;
        }

        async function activateAuthenticatedWorkspace(user, { reuseStoredThread }) {
            clearMonitoringState();
            currentUser = user;
            prepareAuthenticatedThread({ reuseStoredThread });
            document.querySelectorAll('[data-current-username]').forEach((element) => {
                element.textContent = currentUser.username;
            });
            document.querySelectorAll('[data-current-role]').forEach((element) => {
                element.textContent = currentUser.role === 'admin' ? '管理员' : '用户';
            });
            clearAppStatus();
            setMonitoringAccess();
            authGate?.classList.add('hidden');
            appShell?.classList.remove('hidden');
            await loadConversationHistory();
        }

        async function restoreSession() {
            setAuthGateState('loading');
            authGate?.classList.remove('hidden');
            appShell?.classList.add('hidden');
            try {
                const response = await apiFetch('/api/auth/me', {}, { handleUnauthorized: false });
                if (response.status === 401) {
                    clearAuthenticatedState();
                    return;
                }
                if (!response.ok) {
                    showAuthServiceError();
                    return;
                }
                await activateAuthenticatedWorkspace(await response.json(), { reuseStoredThread: true });
            } catch (error) {
                console.error('Session restore failed:', error);
                showAuthServiceError();
            }
        }

        async function submitLogin(event) {
            event.preventDefault();
            if (!loginUsername || !loginPassword || !loginSubmit) return;
            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            loginSubmit.disabled = true;
            if (loginError) {
                loginError.textContent = '';
                loginError.classList.add('hidden');
            }
            try {
                if (!username || !password) return;
                const response = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }, { handleUnauthorized: false });
                if (response.status === 401) {
                    showLoginView('用户名或密码错误');
                    return;
                }
                if (response.status === 429) {
                    const retryAfter = Number.parseInt(response.headers.get('Retry-After') || '', 10);
                    showLoginView(Number.isFinite(retryAfter)
                        ? '登录尝试过多，请稍后再试。'
                        : '登录暂不可用，请稍后再试。');
                    return;
                }
                if (!response.ok) {
                    showLoginView('登录失败，请稍后重试。');
                    return;
                }
                await activateAuthenticatedWorkspace(await response.json(), { reuseStoredThread: false });
            } catch (error) {
                console.error('Login failed:', error);
                showLoginView('暂时无法连接服务，请稍后重试。');
            } finally {
                loginPassword.value = '';
                loginSubmit.disabled = false;
            }
        }

        async function logout() {
            if (!logoutButtons.length) return;
            clearAppStatus();
            logoutButtons.forEach((button) => { button.disabled = true; });
            try {
                const response = await apiFetch('/api/auth/logout', {
                    method: 'POST'
                }, { handleUnauthorized: false });
                if (response.ok || response.status === 401) {
                    clearAuthenticatedState();
                    return;
                }
                throw new Error(`Logout failed with status ${response.status}.`);
            } catch (error) {
                console.error('Logout failed:', error);
                showAppStatus('退出登录失败，请稍后重试。');
            } finally {
                logoutButtons.forEach((button) => { button.disabled = false; });
            }
        }

        function setHistoryError(message) {
            if (!historyError) return;

            historyError.textContent = message;
            historyError.classList.toggle('hidden', !message);
        }

        function invalidateHistoryRequest() {
            historyRequestGeneration += 1;
            activeHistoryRequestController?.abort();
            activeHistoryRequestController = null;
        }

        function setSending(sending) {
            isSending = sending;

            [chatInput, sendMessageBtn].forEach((element) => {
                if (!element) return;
                element.disabled = sending;
                element.setAttribute('aria-busy', String(sending));
                element.style.opacity = sending ? '0.6' : '';
                element.style.cursor = sending ? 'wait' : '';
            });
        }

        function updateAssistantMessage(row, message) {
            row.querySelector('[data-assistant-message]').textContent = message;
        }

        async function readSse(response, callback) {
            const reader = response.body?.getReader();
            if (!reader) {
                throw new Error('Streaming response body is unavailable.');
            }

            const decoder = new TextDecoder();
            let buffer = '';

            const processFrame = (frame) => {
                let event = 'message';
                const dataLines = [];

                frame.split(/\r?\n/).forEach((line) => {
                    if (line.startsWith('event:')) {
                        event = line.slice(6).trim();
                    } else if (line.startsWith('data:')) {
                        dataLines.push(line.slice(5).trim());
                    }
                });

                if (!dataLines.length) return;
                callback({ event, data: JSON.parse(dataLines.join('\n')) });
            };

            while (true) {
                const { done, value } = await reader.read();
                buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

                let separator = buffer.match(/\r?\n\r?\n/);
                while (separator) {
                    const frame = buffer.slice(0, separator.index);
                    buffer = buffer.slice(separator.index + separator[0].length);
                    processFrame(frame);
                    separator = buffer.match(/\r?\n\r?\n/);
                }

                if (done) break;
            }

            buffer += decoder.decode();
            if (buffer.trim()) {
                processFrame(buffer);
            }
        }

        function historyAgeGroup(updatedAt) {
            const date = new Date(updatedAt);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            date.setHours(0, 0, 0, 0);
            const ageInDays = Math.max(0, Math.floor((today - date) / 86400000));

            if (ageInDays === 0) return '今天';
            if (ageInDays === 1) return '昨天';
            if (ageInDays <= 7) return '7天内';
            if (ageInDays <= 30) return '30天内';
            return '更早';
        }

        async function loadConversationHistory() {
            const requestGeneration = ++historyListRequestGeneration;
            activeHistoryListRequestController?.abort();
            const controller = new AbortController();
            activeHistoryListRequestController = controller;

            try {
                const response = await apiFetch('/api/conversations', {
                    signal: controller.signal
                });
                if (!response.ok) throw new Error(`History request failed with status ${response.status}.`);

                const entries = await response.json();
                if (requestGeneration !== historyListRequestGeneration || activeHistoryListRequestController !== controller) return;
                historyEntries = entries;
                renderConversationHistory(historyEntries);
                setHistoryError('');
            } catch (error) {
                if (error instanceof UnauthorizedError || requestGeneration !== historyListRequestGeneration || activeHistoryListRequestController !== controller || error.name === 'AbortError') return;
                console.error('Conversation history failed:', error);
                setHistoryError('无法加载对话历史，请稍后重试。');
            } finally {
                if (activeHistoryListRequestController === controller) {
                    activeHistoryListRequestController = null;
                }

        async function openConversation(threadId) {
            activeRequestController?.abort();
            activeRequestController = null;
            setSending(false);
            const requestGeneration = ++historyRequestGeneration;
            activeHistoryRequestController?.abort();
            const controller = new AbortController();
            activeHistoryRequestController = controller;

            try {
                const response = await apiFetch(conversationUrl(threadId), { signal: controller.signal });
                if (!response.ok) throw new Error(`Conversation request failed with status ${response.status}.`);

                const conversation = await response.json();
                if (requestGeneration !== historyRequestGeneration || activeHistoryRequestController !== controller) return;
                currentThreadId = conversation.id;
                try {
                    localStorage.setItem(STORAGE_KEYS.threadId, currentThreadId);
                } catch (error) {
                    // The selected conversation remains active in memory when storage is unavailable.
                }
                renderConversationMessages(conversation.messages);
                enterConversationState();
                await loadConversationHistory();
            } catch (error) {
                if (error instanceof UnauthorizedError) return;
                if (error.name !== 'AbortError' && requestGeneration === historyRequestGeneration) {
                    console.error('Conversation open failed:', error);
                    setHistoryError('无法打开对话，请稍后重试。');
                }
            } finally {
                if (activeHistoryRequestController === controller) {
                    activeHistoryRequestController = null;
                }
            }
        }

        async function loadMonitoringData() {

            activeMonitoringRequestController?.abort();
            const controller = new AbortController();
            activeMonitoringRequestController = controller;
            monitoringText(monitoringTraceList, '正在加载监控数据…');
            monitoringText(monitoringTraceDetail, '选择一条 Trace 查看详情。');
            try {
                const [summaryResponse, tracesResponse, evaluationsResponse] = await Promise.all([
                    apiFetch('/api/monitoring/summary', { signal: controller.signal }),
                    apiFetch('/api/monitoring/traces', { signal: controller.signal }),
                    apiFetch('/api/monitoring/evaluations', { signal: controller.signal })
                ]);
                if (!isCurrentMonitoringRequest(requestGeneration, controller)) return;
                if (!summaryResponse.ok || !tracesResponse.ok || !evaluationsResponse.ok) {
                    throw new Error('Monitoring request failed.');
                }
                const [summary, tracePage, evaluations] = await Promise.all([
                    summaryResponse.json(), tracesResponse.json(), evaluationsResponse.json()
                ]);
                if (!isCurrentMonitoringRequest(requestGeneration, controller)) return;
                monitoringData = { summary, traces: tracePage.items || [], evaluations: evaluations || [] };
                renderMonitoringKpis(summary);
                renderMonitoringTraceList(monitoringData.traces);
                applyMonitoringTab(activeMonitoringTab);

                    monitoringText(monitoringTraceDetail, '监控数据不可用。', 'text-error');

            }
        }

        async function submitChatMessage() {
            if (isSending || !chatInput || !chatMessages) return;
            const value = chatInput.value.trim();
            if (!value) return;

            setModelDropdownOpen(false);
            closeHistoryActionMenu();
            enterConversationState();

            const messageIndex = ++messageThreadCounter;
            const userMessageId = `message-thread-${messageIndex}`;
            chatMessages.appendChild(createMessageRow('user', value));
            const assistantRow = createMessageRow('assistant', '正在处理…', userMessageId);
            chatMessages.appendChild(assistantRow);
            addMessageThreadItem(userMessageId, messageIndex, value);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatThread?.scrollTo({ top: chatThread.scrollHeight, behavior: 'smooth' });

            const controller = new AbortController();
            activeRequestController = controller;
            setSending(true);
            let receivedTerminalEvent = false;

            try {
                const response = await apiFetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thread_id: currentThreadId,
                        message: value
                    }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(`Chat request failed with status ${response.status}.`);
                }

                await readSse(response, ({ event, data }) => {
                    if (event === 'final') {
                        receivedTerminalEvent = true;
                        updateAssistantMessage(assistantRow, data.content || '');
                    } else if (event === 'error') {
                        receivedTerminalEvent = true;
                        updateAssistantMessage(assistantRow, data.message || '暂时无法处理本次请求。');
                    }
                    chatThread?.scrollTo({ top: chatThread.scrollHeight, behavior: 'smooth' });
                });

                if (receivedTerminalEvent) {
                    await loadConversationHistory();
                }

                const assistantMessage = assistantRow.querySelector('[data-assistant-message]');
                if (!receivedTerminalEvent && !assistantMessage?.textContent.includes('暂时无法')) {
                    updateAssistantMessage(assistantRow, '本次请求未返回最终回答，请稍后重试。');
                }
            } catch (error) {
                if (error instanceof UnauthorizedError) {
                    return;
                } else if (error.name === 'AbortError') {
                    updateAssistantMessage(assistantRow, '请求已取消。');
                } else {
                    console.error('Chat stream failed:', error);
                    updateAssistantMessage(assistantRow, '网络或服务异常，请稍后重试。');
                }
            } finally {
                if (activeRequestController === controller) {
                    activeRequestController = null;
                    setSending(false);
                }
            }
        }

        const userProfileBtn = document.getElementById('user-profile-btn');
        const userPopupMenu = document.getElementById('user-popup-menu');
        if(userProfileBtn && userPopupMenu) {
            userProfileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                userPopupMenu.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if(!userPopupMenu.contains(e.target)) {
                    userPopupMenu.classList.add('hidden');
                }
            });
        }

        // Model selector dropdown toggle
        const modelSelector = document.getElementById('model-selector');
        const modelSelectorBtn = document.getElementById('model-selector-btn');
        const modelDropdown = document.getElementById('model-dropdown');
        const modelSelectorArrow = document.getElementById('model-selector-arrow');
        const composerSection = document.getElementById('composer-section');

        function setModelDropdownOpen(isOpen) {
            if (!modelDropdown || !modelSelectorBtn || !composerSection) return;

            modelDropdown.classList.toggle('hidden', !isOpen);
            modelDropdown.classList.toggle('flex', isOpen);
            modelSelectorBtn.setAttribute('aria-expanded', String(isOpen));
            composerSection.classList.toggle('mt-8', !isOpen);
            composerSection.classList.toggle('mt-24', isOpen);

            if (modelSelectorArrow) {
                modelSelectorArrow.textContent = isOpen ? 'expand_less' : 'expand_more';
            }
        }

        if (modelSelectorBtn && modelDropdown) {
            modelSelectorBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setModelDropdownOpen(modelDropdown.classList.contains('hidden'));
            });

            document.addEventListener('click', (e) => {
                if (modelSelector && !modelSelector.contains(e.target)) {
                    setModelDropdownOpen(false);
                }
            });
        }

        function closeHistoryActionMenu() {
            historyActionMenu?.classList.add('hidden');
            if (activeHistoryActionTrigger) {
                activeHistoryActionTrigger.classList.remove('is-active');
                activeHistoryActionTrigger = null;
            }
        }

        function openHistoryActionMenu(trigger) {
            if (!historyActionMenu) return;

            closeHistoryActionMenu();
            const rect = trigger.getBoundingClientRect();
            const menuWidth = 128;
            const menuHeight = 152;
            const left = Math.min(rect.right + 8, window.innerWidth - menuWidth - 8);
            const top = Math.min(rect.top + rect.height / 2 - 8, window.innerHeight - menuHeight - 8);

            historyActionMenu.style.left = `${Math.max(8, left)}px`;
            historyActionMenu.style.top = `${Math.max(8, top)}px`;
            historyActionMenu.classList.remove('hidden');

            const pinAction = historyActionMenu.querySelector('[data-history-action="pin"]');
            const pinLabel = pinAction?.querySelector('span:last-child');
            if (pinLabel) {
                pinLabel.textContent = activeHistoryConversation?.is_pinned ? '取消置顶' : '置顶';
            }

            activeHistoryActionTrigger = trigger;
            activeHistoryActionTrigger.classList.add('is-active');
        }

        function setDialogVisible(dialog, visible) {
            dialog?.classList.toggle('hidden', !visible);
            dialog?.classList.toggle('flex', visible);
            if (!visible) {
                dialogReturnFocus?.focus();
                dialogReturnFocus = null;
            }
        }

        function showRenameDialog(conversation, opener) {
            if (!renameDialog || !renameInput) return;

            dialogReturnFocus = opener;
            renameDialog.dataset.threadId = conversation.id;
            renameInput.value = conversation.title;
            setDialogVisible(renameDialog, true);
            renameInput.focus();
            renameInput.select();
        }

        function showDeleteDialog(conversation, opener) {
            if (!deleteConfirmDialog) return;

            dialogReturnFocus = opener;
            deleteConfirmDialog.dataset.threadId = conversation.id;
            setDialogVisible(deleteConfirmDialog, true);
            deleteCancelButton?.focus();
        }

        async function handleHistoryAction(action, opener) {
            const conversation = activeHistoryConversation;
            if (!conversation) return;

            if (action === 'rename') {
                showRenameDialog(conversation, opener);
                return;
            }
            if (action === 'delete') {
                showDeleteDialog(conversation, opener);
                return;
            }
            if (action === 'pin') {
                const response = await apiFetch(conversationUrl(conversation.id), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_pinned: !conversation.is_pinned })
                });
                if (!response.ok) throw new Error(`Conversation update failed with status ${response.status}.`);
                await loadConversationHistory();
            }
        }

        async function deleteActiveConversation() {
            const threadId = deleteConfirmDialog?.dataset.threadId;
            if (!threadId) return;

            const response = await apiFetch(conversationUrl(threadId), { method: 'DELETE' });
            if (!response.ok) throw new Error(`Conversation delete failed with status ${response.status}.`);

            setDialogVisible(deleteConfirmDialog, false);
            if (threadId === currentThreadId) resetToWelcomeState();
            await loadConversationHistory();
        }

        historyList?.addEventListener('click', (event) => {
            const actionTrigger = event.target.closest('[data-history-action-trigger]');
            if (actionTrigger) {
                event.stopPropagation();
                activeHistoryConversation = historyEntries.find((conversation) => conversation.id === actionTrigger.dataset.threadId) || null;
                if (activeHistoryActionTrigger === actionTrigger && !historyActionMenu?.classList.contains('hidden')) {
                    closeHistoryActionMenu();
                } else {
                    openHistoryActionMenu(actionTrigger);
                }
                return;
            }

            const threadButton = event.target.closest('button[data-thread-id]');
            if (threadButton) openConversation(threadButton.dataset.threadId);
        });

        historyActionMenu?.addEventListener('click', async (event) => {
            event.stopPropagation();
            const actionButton = event.target.closest('[data-history-action]');
            if (!actionButton) return;

            const opener = activeHistoryActionTrigger;
            closeHistoryActionMenu();
            try {
                await handleHistoryAction(actionButton.dataset.historyAction, opener);
            } catch (error) {
                if (error instanceof UnauthorizedError) return;
                console.error('Conversation action failed:', error);
                setHistoryError('操作失败，请稍后重试。');
            }
        });

        renameForm?.addEventListener('submit', async (event) => {
            event.preventDefault();
            const threadId = renameDialog?.dataset.threadId;
            const title = renameInput?.value.trim();
            if (!threadId || !title) return;

            try {
                const response = await apiFetch(conversationUrl(threadId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                if (!response.ok) throw new Error(`Conversation rename failed with status ${response.status}.`);
                setDialogVisible(renameDialog, false);
                await loadConversationHistory();
            } catch (error) {
                if (error instanceof UnauthorizedError) return;
                console.error('Conversation rename failed:', error);
                setHistoryError('重命名失败，请稍后重试。');
            }
        });

        document.querySelector('[data-rename-cancel]')?.addEventListener('click', () => setDialogVisible(renameDialog, false));
        document.querySelector('[data-delete-cancel]')?.addEventListener('click', () => setDialogVisible(deleteConfirmDialog, false));
        document.querySelector('[data-delete-confirm]')?.addEventListener('click', async () => {
            try {
                await deleteActiveConversation();
            } catch (error) {
                if (error instanceof UnauthorizedError) return;
                console.error('Conversation delete failed:', error);
                setHistoryError('删除失败，请稍后重试。');
            }
        });

        document.addEventListener('click', () => {
            closeHistoryActionMenu();
        });

        // Sidebar collapse toggle logic
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const sidebarToggleBtnExpanded = document.getElementById('sidebar-toggle-btn-expanded');
        const sidebarToggleBtnCollapsed = document.getElementById('sidebar-toggle-btn-collapsed');
        
        let isSidebarCollapsed = false;

        function toggleSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            if(isSidebarCollapsed) {
                sidebar.classList.add('sidebar-collapsed');
                sidebar.classList.replace('w-sidebar-expanded', 'w-sidebar-collapsed');
                mainContent.classList.replace('md:ml-[264px]', 'md:ml-[64px]');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                sidebar.classList.replace('w-sidebar-collapsed', 'w-sidebar-expanded');
                mainContent.classList.replace('md:ml-[64px]', 'md:ml-[264px]');
            }
        }

        if (sidebarToggleBtnExpanded) {
            sidebarToggleBtnExpanded.addEventListener('click', toggleSidebar);
        }
        if (sidebarToggleBtnCollapsed) {
            sidebarToggleBtnCollapsed.addEventListener('click', toggleSidebar);
        }

        // Search modal toggle logic
        const searchModal = document.getElementById('search-modal');
        const searchTriggerBtn = document.getElementById('search-trigger-btn');
        const closeSearchBtn = document.getElementById('close-search-btn');
        const searchInput = document.getElementById('search-input');

        if(searchTriggerBtn && searchModal) {
            searchTriggerBtn.addEventListener('click', () => {
                searchModal.classList.remove('hidden');
                setTimeout(() => searchInput && searchInput.focus(), 100);
            });
        }

        if(closeSearchBtn && searchModal) {
            closeSearchBtn.addEventListener('click', () => {
                searchModal.classList.add('hidden');
            });
        }

        function trapHistoryDialogFocus(event) {
            if (event.key !== 'Tab') return false;

            const dialog = !renameDialog?.classList.contains('hidden')
                ? renameDialog
                : !deleteConfirmDialog?.classList.contains('hidden')
                    ? deleteConfirmDialog
                    : null;
            if (!dialog) return false;

            const focusable = Array.from(dialog.querySelectorAll('button:not([disabled]), input:not([disabled])'));
            if (!focusable.length) return false;

            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
                return true;
            }
            if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
                return true;
            }
            return false;
        }

        restoreSession();

        window.addEventListener('keydown', (e) => {
            if (trapHistoryDialogFocus(e)) return;
            if (e.key === 'Escape' && !renameDialog?.classList.contains('hidden')) {
                e.preventDefault();
                setDialogVisible(renameDialog, false);
                return;
            }
            if (e.key === 'Escape' && !deleteConfirmDialog?.classList.contains('hidden')) {
                e.preventDefault();
                setDialogVisible(deleteConfirmDialog, false);
                return;
            }
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                searchModal?.classList.remove('hidden');
                setTimeout(() => searchInput && searchInput.focus(), 100);
            }
            if (e.key === 'Escape') {
                searchModal?.classList.add('hidden');
                userPopupMenu?.classList.add('hidden');
                closeHistoryActionMenu();
                setModelDropdownOpen(false);
            }
        });
    </script>
</body></html>
