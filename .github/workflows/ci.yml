name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not live and not integration" -q
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag metro-agent:${{ github.sha }} .
  auth-mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: '%'
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AUTH_MYSQL_ADMIN_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/mysql
      AUTH_MYSQL_TEST_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_MYSQL_TEST_DATABASE: metro_auth_test_github_${{ github.run_id }}_${{ github.run_attempt }}
      AUTH_SESSION_PEPPER: ci-test-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: pytest tests/integration/test_auth_mysql.py -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
