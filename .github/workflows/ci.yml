name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not live and not integration" -q
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag metro-agent:${{ github.sha }} .
  auth-mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: metro_auth_test
          MYSQL_USER: metro_auth
          MYSQL_PASSWORD: ci-auth-password
          MYSQL_ROOT_PASSWORD: ci-root-password
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AUTH_DATABASE_URL: mysql+pymysql://metro_auth:ci-auth-password@127.0.0.1:3306/metro_auth_test
      AUTH_MYSQL_TEST_URL: mysql+pymysql://metro_auth:ci-auth-password@127.0.0.1:3306/metro_auth_test
      AUTH_SESSION_PEPPER: ci-test-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ".[dev]"
      - run: alembic -c alembic-auth.ini upgrade head
      - run: pytest tests/integration/test_auth_mysql.py -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
