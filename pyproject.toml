[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-agent"
version = "0.1.0"
description = "A multi-agent assistant for metro communication operations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Metro Agent contributors" }]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "langgraph>=1.2,<2",
  "langgraph-checkpoint-redis>=0.5,<1", "langchain>=1.3,<2", "langchain-core>=1.4,<2",
  "langchain-openai>=1.2,<2", "langchain-community>=0.4,<1",
  "langchain-ollama>=1.1,<2", "langchain-huggingface>=1.2,<2",
  "chromadb==1.5.9", "redis>=5,<7", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "pymysql[rsa]>=1.1,<2", "pwdlib[argon2]>=0.2,<1",
  "alembic>=1.14,<2", "pydantic>=2,<3",
  "python-dotenv>=1,<2", "httpx>=0.27,<1", "tiktoken>=0.8,<1",
  "PyYAML>=6,<7", "numpy>=1.26,<3", "requests>=2.32,<3",
  "torch>=2.12,<2.13", "transformers>=4.57.6,<5",
  "huggingface-hub[inference]>=0.36.2,<1", "sentence-transformers>=5.5.1,<5.6",
  "llama-index-core>=0.12,<1", "llama-index-llms-deepseek>=0.3,<1",
  "llama-index-embeddings-huggingface>=0.5,<1",
  "llama-index-postprocessor-sbert-rerank>=0.3,<1",
  "llama-index-vector-stores-chroma>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
evaluation = ["ragas>=0.3,<1", "deepeval>=3,<4", "datasets>=3,<4", "langmem>=0.0.20,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metro_agent = ["static/*.html", "static/*.css", "static/fonts/*.woff2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires dedicated backing services and never targets production data",
  "live: calls live model or external service providers",
]

[tool.ruff.lint]
# Preserve the legacy code style while CI blocks syntax and undefined-name defects.
select = ["F"]
